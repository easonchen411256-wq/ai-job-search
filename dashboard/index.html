<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>求职工作台</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232957d3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extra.css">
</head>
<body>
  <header class="topbar"><div><p class="eyebrow">AI JOB SEARCH</p><h1>求职工作台</h1></div><div class="top-actions"><span id="updated" class="muted"></span><button class="button secondary" id="refresh">刷新</button><button class="button secondary" id="upload-resume">上传简历</button><button class="button" id="new-search-task">新建搜岗任务</button></div></header>
  <main>
    <section class="stats" id="stats"></section>
    <section class="search-status" id="search-status" aria-live="polite"></section>
    <section class="workspace">
      <aside class="filters"><div class="filter-heading"><h2>筛选岗位</h2><button id="clear-filters" class="text-button">清除</button></div><label>搜索<input id="search" placeholder="公司、岗位、城市"></label><label>地区<select id="province"><option value="">全部地区</option></select></label><label>岗位方向<select id="role-family"><option value="">全部方向</option></select></label><label>招聘类型<select id="recruitment-type"><option value="">全部类型</option><option>秋招</option><option>实习</option><option>社招</option><option>待核验</option></select></label><label>优先级<select id="priority"><option value="">全部优先级</option><option>P0</option><option>P1</option><option>P2</option><option>Skip</option></select></label><label>流程阶段<select id="stage"><option value="">全部阶段</option><option value="pending_review">待筛选</option><option value="ready_to_apply">待投递</option><option value="applied">已投递</option><option value="interview">面试中</option><option value="offer">Offer</option><option value="rejected">已结束</option></select></label><label class="check"><input type="checkbox" id="psychology"> 仅心理学触发岗位</label><p class="filter-help">秋招、实习、社招使用不同颜色标签，方便快速区分。</p></aside>
      <section class="job-section"><div class="section-title"><div><p class="eyebrow">JOB POOL</p><h2>岗位池 <span id="job-total" class="count"></span></h2></div><div class="legend"><span><i class="dot p0"></i>P0</span><span><i class="dot p1"></i>P1</span><span><i class="dot p2"></i>P2</span></div></div><div class="stage-tabs" id="stage-tabs"></div><div id="job-list" class="job-list"></div></section>
    </section>
    <section class="tasks-section"><div class="section-title"><div><p class="eyebrow">NEXT ACTIONS</p><h2>招聘待办</h2></div><button id="new-task" class="button secondary">+ 添加待办 / 事件</button></div><div class="task-grid" id="task-grid"></div></section>
  </main>
  <dialog id="resume-dialog" class="dialog"><form method="dialog" id="resume-form"><div class="dialog-heading"><h2>上传简历</h2><button type="button" class="close" data-dialog-cancel aria-label="关闭">×</button></div><p class="dialog-copy">简历只保存在本机的 <code>documents/cv</code>。可一次选择多份版本（PDF / Word / TXT）；Agent 会以这些简历为事实来源搜索岗位，搜索结果将自动进入岗位池。</p><label>选择简历（可多选）<input name="resume" type="file" accept=".pdf,.doc,.docx,.txt" multiple required></label><div id="resume-list" class="resume-list"></div><div class="dialog-actions"><button type="button" data-dialog-cancel class="button secondary">取消</button><button type="submit" class="button">保存简历</button></div></form></dialog>
  <dialog id="search-dialog" class="dialog"><form method="dialog" id="search-form"><div class="dialog-heading"><h2>新建搜岗任务</h2><button type="button" class="close" data-dialog-cancel aria-label="关闭">×</button></div><p class="dialog-copy">先定义本轮要搜索什么。平台结果会以“待核验线索”入池；只有能取得公开 JD 的岗位才会标为已核验。</p><div class="form-grid"><label>检索地区<select name="scope"><option value="广东、广西">广东、广西</option></select></label><label>岗位关键词<input name="keywords" value="AI 产品、产品经理、用户研究、用户洞察、管培生、心理教师" required><small>输入“心理教师”会自动扩展检索心理健康教师、心理辅导教师等相关职位。</small></label></div><fieldset class="search-fieldset" id="role-family-options"><legend>岗位方向</legend></fieldset><fieldset class="search-fieldset" id="search-source-options"><legend>检索渠道（默认全选）</legend></fieldset><label class="check"><input type="checkbox" name="psychology_trigger" checked> 同时反向搜索接受心理学专业的岗位</label><label>本轮补充要求<textarea name="notes" placeholder="例如：心理教师为最高优先，广东/广西高校、职校、技校、中小学的秋招、实习和社招都要。"></textarea></label><p id="search-dialog-info" class="dialog-info"></p><p id="search-dialog-error" class="dialog-error"></p><div class="dialog-actions"><button type="button" data-dialog-cancel class="button secondary">取消</button><button type="submit" class="button">创建并开始搜岗</button></div></form></dialog>
  <dialog id="task-dialog" class="dialog"><form method="dialog" id="task-form"><div class="dialog-heading"><h2>添加待办 / 事件</h2><button type="button" class="close" data-dialog-cancel aria-label="关闭">×</button></div><div class="form-grid"><label>类型<select name="task_type"><option value="personal_task">个人待办</option><option value="recruitment_event">招聘事件</option></select></label><label>事项标题*<input name="title" required placeholder="如：准备一面"></label><label>公司<input name="company"></label><label>岗位<input name="job_title"></label><label>日期<input name="date" type="date"></label><label>截止日期<input name="deadline" type="date"></label><label>优先级<select name="priority"><option>P1</option><option>P0</option><option>P2</option></select></label><label>事项类型<input name="event_type" placeholder="如：interview_prep"></label></div><label>备注<textarea name="notes"></textarea></label><div class="dialog-actions"><button type="button" data-dialog-cancel class="button secondary">取消</button><button type="submit" class="button">保存待办</button></div></form></dialog>
  <button id="new-job" hidden aria-hidden="true"></button><dialog id="job-dialog"><form id="job-form"></form></dialog>
  <aside id="drawer" class="drawer" aria-hidden="true"><button id="drawer-close" class="close">×</button><div id="drawer-content"></div></aside><div id="toast" class="toast"></div><script src="app.js"></script><script src="overrides.js"></script>
</body>
</html>
